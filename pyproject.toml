[project]
name = "boepie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click==8.3.1",
    "cult-cargo>=0.2.0",
    "fastmcp>=2.14.0",
    "pydantic==2.12.5",
    "pydantic-ai>=1.78.0",
    "python-casacore>=3.7.1",
    "python-dotenv==1.2.1",
    "rich==14.3.2",
    "stimela",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.52",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
traces = [
    "markdown>=3.10.2",
    "weasyprint>=68.1",
]

[tool.uv]
override-dependencies = [
    "rich>=14.3.2", # This is because of heavy stimela restrictions
]

[tool.uv.sources]
stimela = { git = "https://github.com/caracal-pipeline/stimela.git", branch = "master" }

[project.scripts]
boepie = "boepie.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
