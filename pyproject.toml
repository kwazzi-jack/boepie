[project]
name = "boepie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.9",
    "click==8.4.1",
    "cult-cargo==0.2.0",
    "fastembed>=0.8.0",
    "fastmcp==2.14.0",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "platformdirs>=4.10.0",
    "pydantic==2.13.4",
    "pydantic-ai==1.78.0",
    "python-casacore==3.7.1",
    "python-dotenv==1.2.2",
    "rich==14.3.2",
    "stimela",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.52",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
traces = [
    "markdown>=3.10.2",
    "weasyprint>=68.1",
]

[tool.uv]
override-dependencies = [
    "rich>=14.3.2", # This is because of heavy stimela restrictions
]

[tool.uv.sources]
stimela = { git = "https://github.com/caracal-pipeline/stimela.git", branch = "master" }

[project.scripts]
boepie = "boepie.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
