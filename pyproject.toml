[project]
name = "boepie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.9",
    "click==8.4.2",
    "cult-cargo>=0.2.0",
    "fastembed>=0.8.0",
    "fastmcp==3.4.7",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "mdit-py-plugins>=0.6.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "platformdirs>=4.10.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.15.0",
    "python-casacore==3.8.1",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "stimela",
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.52",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
traces = [
    "markdown>=3.10.2",
    "weasyprint>=68.1",
]

[tool.uv.sources]
stimela = { git = "https://github.com/caracal-pipeline/stimela.git", branch = "master" }

[project.scripts]
boepie = "boepie.__main__:main"

[project.optional-dependencies]
mineru = [
    "mineru[pipeline]>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
