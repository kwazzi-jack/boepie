[project]
name = "boepie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25s>=0.3.9",
    "click==8.4.2",
    "cult-cargo>=0.2.1",
    "fastembed>=0.8.0",
    "fastmcp==3.4.7",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "mdit-py-plugins>=0.6.1",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "platformdirs>=4.10.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.15.0",
    "python-casacore==3.8.1",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "rich-click>=1.9.8",
    "scabha>=2.2.0rc4",
    "stimela>=2.1.4,<3",
    "tomlkit>=0.15.1",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prompt-toolkit>=3.0.52",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
traces = [
    "markdown>=3.10.2",
    "weasyprint>=68.1",
]

[project.scripts]
boepie = "boepie.__main__:main"

[project.optional-dependencies]
mineru = [
    "mineru[pipeline]>=3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Pinned to the branches that carry the two fixes cult-cargo needs to load at
# all, neither of which is in any published release. Versions cannot express
# this: the scabha branch calls itself 2.2.0rc4 and the cult-cargo branch
# 0.3.0rc0, same as the PyPI releases that lack the fixes, so the revs below
# are the only thing distinguishing them.
#   scabha 43af1f1  caracal-pipeline/scabha#45. The placement check added in
#     2.2.0rc3 ran inside resolve_config_refs, which recurses into a mapping
#     after that mapping has been merged with its own _include. Key order in
#     the merged child is a merge artefact, so a legal top-of-mapping _use was
#     rejected: cult-cargo's pfb-imaging.yml failed at cabs.pfb.degrid.
#   cult-cargo 875f3bc  branch move-use-statements, off r0.3.0. Finishes the
#     migration e940632b started: 16 bare _use directives across 13 files
#     moved to the top of their mapping, the placement rc3 now requires.
# Drop both once the fixes are released and bump the floors instead.
[tool.uv.sources]
scabha = { git = "https://github.com/kwazzi-jack/scabha.git", rev = "43af1f135b244a40dd52b7176c314f46a4535deb" }
cult-cargo = { git = "https://github.com/kwazzi-jack/cult-cargo.git", rev = "875f3bc5ec998d1a179722e9cac42f63c95ffcf7" }
